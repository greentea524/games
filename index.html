<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy (#101). Hardening, not a fix: these pages have
         no XSS sink, no eval, and saves are parsed through shared/storage, so
         nothing here is currently exploitable. What it buys is that the one
         third-party script on the page — the analytics tag (#102) — is the
         *only* third party the browser will ever talk to, and that a future
         XSS sink meets a policy that already exists.

         Written off a measurement of what the pages actually request, not a
         guess. Notes on the non-obvious parts:

         - #102 dropped analytics, so every external host is gone from this
           policy: nothing on these pages loads from an origin the repo does
           not control. script-src, connect-src and img-src are 'self' and
           local schemes only.
         - 'unsafe-inline' for scripts is still here, but for one reason now
           rather than two — every shell has an inline pre-init sizing script.
           The analytics bootstrap was the other. Replacing that one with a
           hash is the remaining step; it is worth doing on its own terms and
           was not folded in here, because #102 was a decision about analytics
           rather than a CSP change.
         - data: and blob: for img/media because every sprite in all five games
           is generated at runtime through canvas, not loaded as a file.
         - frame-ancestors and report-uri are deliberately absent: a meta CSP
           ignores both, and including them only logs a console warning. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' data: blob:; base-uri 'none'; form-action 'none'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>games</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
