<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy, as on every page here (#101, #108).

         Note what is *absent*: there is no `sha256-` hash in `script-src`.
         This page used to carry one, covering the inline script that sized
         `#game` to a whole multiple of 160x144 before first paint. #119 moved
         the game onto `shared/stage3d.ts`, which sizes itself from its
         container through a ResizeObserver, so the inline script is gone and
         the hash with it. `npm run qa:csp` checks both directions — every
         inline script hashed, and every hash covering a script — so leaving
         the hash behind would have failed rather than sat here granting
         permission to nothing. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' data: blob:; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Tower Stacker - drop the block, build the tower</title>
  </head>
  <body>
    <!-- The stage's parent. The canvas and the game's HUD overlay are both
         appended here by shared/stage3d.ts; there is no bezel and no markup
         for controls, because this game's control is the canvas itself. -->
    <div id="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
